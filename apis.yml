aid: sheeva
name: Sheeva
description: >-
  Sheeva.AI (legally Parkofon Inc.) builds transaction infrastructure for connected vehicles.
  Its SheevaConnect platform lets a vehicle discover nearby Sheeva Pay outlets, authenticate the
  driver, and pay for real-world services - fueling, EV charging, parking, tolling, QSR and
  curbside pickup, and car wash - directly from the infotainment system, using patented location
  intelligence (SheevaLocate, SheevaFence) and tokenized in-vehicle payments (SheevaPay). The
  SheevaConnect partner API 2.0 exposes drivers, vehicles, sessions, service hubs, payments,
  wallets and cards, loyalty, feedback, and HMAC-signed status webhooks across US and India regions.
