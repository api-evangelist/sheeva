openapi: 3.2.0
info:
  title: SheevaConnect Credit Cards API
  version: '2.0'
  description: This SheevaConnect™ API Specification 2.0 is © 2024 Parkofon Inc.
  contact:
    name: Sheeva.AI
    url: https://sheeva.ai/contact-us
  x-company: Parkofon Inc. (d/b/a Sheeva.AI)
servers:
- url: https://us-apis.sheeva.ai
  description: Production (USA)
- url: https://in-apis.sheeva.ai
  description: Production (India)
- url: https://dev-us-apis.sheeva.ai
  description: Sandbox (USA)
- url: https://dev-in-apis.sheeva.ai
  description: Sandbox (India)
security:
- bearerAuth: []
tags:
- name: Credit Cards
paths:
  /v2/partner-apis/wallet:
    get:
      summary: 1 - Get Vehicle Wallet
      operationId: getVehicleWallet
      tags:
      - Credit Cards
      responses:
        '200':
          description: Response
          content:
            application/json:
              example:
                walletId: 1bf4de4f-442f-42d6-abc6-86a952ef7895
                driverId: dri_bP2lHCcPFzY6Yd19qvdM
                vin: sheeva_vehicle_id_test
                type: VEHICLE
                cards:
                - id: 4e17a735-9810-4236-8544-790886d53f5f
                  lastFour: '0564'
                  status: ACTIVE
                  brand: VISA
                  default: true
      parameters:
      - name: x-sheeva-program-code
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
  /v2/partner-apis/wallet/public-key:
    post:
      summary: 2 - Generate Public Key To Add Credit Card
      operationId: generatePublicKeyToAddCreditCard
      tags:
      - Credit Cards
      responses:
        '200':
          description: Response
          content:
            application/json:
              example:
                key: 
      parameters:
      - name: x-sheeva-program-code
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
      requestBody:
        content:
          application/json:
            example:
              walletId: '{{walletId}}'
              driverId: '{{driverId}}'
              vin: '{{vin}}'
  /v2/partner-apis/wallet/cards:
    post:
      summary: 3 - Add Credit Card To A Wallet
      operationId: addCreditCardToAWallet
      tags:
      - Credit Cards
      responses:
        '200':
          description: Response
          content:
            application/json:
              example:
                state: Success
                message: Credit card added successfully
      parameters:
      - name: x-sheeva-program-code
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
      requestBody:
        content:
          application/json:
            example:
              driverId: '{{driverId}}'
              vin: '{{vin}}'
              walletId: '{{walletId}}'
              encryptedCreditCard: 
  /v2/partner-apis/wallet/{walletId}/cards:
    get:
      summary: 4 - Get Credit Cards Associated To Wallet
      operationId: getCreditCardsAssociatedToWallet
      tags:
      - Credit Cards
      responses:
        '200':
          description: Response
          content:
            application/json:
              example:
              - id: 4e17a735-9810-4236-8544-790886d53f5f
                lastFour: '0564'
                brand: VISA
                default: true
                expired: false
              - id: 90a23da-9810-4236-8544-790886d53f5f
                lastFour: '0564'
                brand: VISA
                default: false
                expired: false
      parameters:
      - name: walletId
        in: path
        required: true
        schema:
          type: string
      - name: x-sheeva-program-code
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
  /v2/partner-apis/wallet/{walletId}/cards/{cardId}:
    get:
      summary: 5 - Get Credit Card By Id
      operationId: getCreditCardById
      tags:
      - Credit Cards
      responses:
        '200':
          description: Response
          content:
            application/json:
              example:
                id: 4e17a735-9810-4236-8544-790886d53f5f
                lastFour: '0564'
                brand: VISA
                default: true
                expired: false
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: string
      - name: walletId
        in: path
        required: true
        schema:
          type: string
      - name: x-sheeva-program-code
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
    patch:
      summary: 6 - Mark Credit Card As Default
      operationId: markCreditCardAsDefault
      tags:
      - Credit Cards
      responses:
        '200':
          description: Response
          content:
            application/json:
              example:
                state: Success
                message: Card set as default
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: string
      - name: walletId
        in: path
        required: true
        schema:
          type: string
      - name: x-sheeva-program-code
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
    delete:
      summary: 7 - Delete Credit Card
      operationId: deleteCreditCard
      tags:
      - Credit Cards
      responses:
        '200':
          description: Response
          content:
            application/json:
              example:
                state: Success
                message: Credit card has been deleted successfully
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: string
      - name: walletId
        in: path
        required: true
        schema:
          type: string
      - name: x-sheeva-program-code
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained from GET /v2/auth (exchange client-id/client-secret), sent in the Authorization header.
    clientCredentials:
      type: apiKey
      in: header
      name: client-id
      description: client-id + client-secret headers on GET /v2/auth to obtain an access token.
