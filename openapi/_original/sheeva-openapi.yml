      tags:
      - Session
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                vehicleLocation:
                  latitude: 19.16323715308841
                  longitude: 72.85860447032306
                  timestamp: 1668531651000
                activeSessions:
                - id: parking_payments_14141asdqwe
                  currentState: CONFIRMED
                  paymentStatus: PAYMENT_COMPLETED
                  serviceType: PARKING
      description: "This request returns current fuel session state and details if there is any session\
        \ with the specified type actively running in the system.\nIf successful, returns: HTTP 200 OK.\n\
        Response Body Field Description:\n\n\n\nField\nDescription\n\n\n\n\nvehicleLocation\nCurrent vehicle\
        \ location  latitude, longitude, timestamp ( in EPOCH )\n\n\nactiveSessions\nArray of active session(s)\
        \ for the the vehicle - if there is any, otherwise it will come as empty\n\n\nactiveSessions[0].id\n\
        Unique service hub identifier  \n\n\nactiveSessions[0].currentState\nCurrent state of the session\
