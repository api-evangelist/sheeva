  /vehicle-events:
    post:
      summary: Vehicle Events
      operationId: vehicleEvents
      tags:
      - Vehicle Events
      responses:
        '200':
          description: Response
      description: 'This request accepts vehicle status for multiple vehicles, which includes current
        vehicle location, fuel / charge level, speed, parking brake and ignition status.

        If successful, returns: HTTP 201 CREATED.

        Note: This replaces the older "Vehicle Events" endpoint. Use this instead.

        '
      parameters:
      - name: x-sheeva-program-code
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
      - name: clientId
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
      requestBody:
        content:
          application/json:
            example:
            - vin: TSTLRGBL663PR2127
              statuses:
              - key: speed
                value: '30.5'
                timestamp: 1685619240
              - key: fuelLevel
                value: '6'
                timestamp: 1685619240
              - key: chargingLevel
                value: '6'
                timestamp: 1685619240
              - key: ignition
                value: 'on'
                timestamp: 1685619240
