openapi: 3.2.0
info:
  title: SheevaConnect Feedback API
  version: '2.0'
  description: This SheevaConnect™ API Specification 2.0 is © 2024 Parkofon Inc.
  contact:
    name: Sheeva.AI
    url: https://sheeva.ai/contact-us
  x-company: Parkofon Inc. (d/b/a Sheeva.AI)
servers:
- url: https://us-apis.sheeva.ai
  description: Production (USA)
- url: https://in-apis.sheeva.ai
  description: Production (India)
- url: https://dev-us-apis.sheeva.ai
  description: Sandbox (USA)
- url: https://dev-in-apis.sheeva.ai
  description: Sandbox (India)
security:
- bearerAuth: []
tags:
- name: Feedback
paths:
  /v2/partner-apis/feedback/reasons:
    get:
      summary: Get Cancellation Reasons
      operationId: getCancellationReasons
      tags:
      - Feedback
      responses:
        '200':
          description: Response
          content:
            application/json:
              example:
                cancellationReasons:
                - code: CHANGE_OF_PLANS
                  description: 'Change of Plans: Plans changed, service no longer neede'
                - code: FOUND_BETTER_OPTION
                  description: 'Found Better Option: Found a more suitable alternative'
                - code: DISSATISFIED_WITH_SERVICE
                  description: 'Dissatisfied Service: Service quality not up to expectations'
                - code: OTHER_REASONS
                  description: 'Other Reasons: Reasons that are not listed'
      description: 'This request allows registering an HTTP POST status webhook with SeevaConnect.

        If successful, returns: HTTP 201 CREATED.

        Examples below demonstrate the json body Sheeva will call your registered webhook endpoint with:


        Service Alert Example

        Status Callback Example'
      parameters:
      - name: x-sheeva-program-code
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
  /v2/partner-apis/feedback:
    post:
      summary: Submit Feedback
      operationId: submitFeedback
      tags:
      - Feedback
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                code: ''
                message: ''
      parameters:
      - name: x-sheeva-program-code
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
      requestBody:
        content:
          application/json:
            example:
              serviceType: UBI_PAYMENTS
              driver_id: ''
              reasonCode: OTHER_REASONS
              reasonText: ''
  /v2/partner-apis/feedback/:
    get:
      summary: Get Feedback
      operationId: getFeedback
      tags:
      - Feedback
      responses:
        '200':
          description: Response
          content:
            application/json:
              example:
                feedback:
                - reasonCode: OTHER_REASONS
                  reasonText: Feedback Text As Received/Entered By The User
                  receivedAt: '2024-03-21 14:04:45'
      parameters:
      - name: x-sheeva-program-code
        in: header
        required: true
        schema:
          type: string
        description: Provided by Sheeva
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained from GET /v2/auth (exchange client-id/client-secret), sent in the Authorization header.
    clientCredentials:
      type: apiKey
      in: header
      name: client-id
      description: client-id + client-secret headers on GET /v2/auth to obtain an access token.
